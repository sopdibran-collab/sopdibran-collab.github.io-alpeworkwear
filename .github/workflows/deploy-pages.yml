name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build motion bundle & SEO
        run: npm run build

      - name: Generate sitemap
        run: node scripts/generate-sitemap.js

      # Publish only customer-facing static files. Keep agent context, docs,
      # tooling, secrets, and repo meta out of the public Pages artifact.
      - name: Assemble public site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          # Allow-list only public paths (no repo meta, agent notes, or build tooling).
          cp -a .nojekyll CNAME robots.txt sitemap.xml _site/
          cp -a *.html _site/
          cp -a assets data _site/
          # Guardrails: these must never ship even if renamed/reintroduced.
          rm -rf \
            _site/.cursor _site/cursor _site/docs _site/src _site/components \
            _site/scripts _site/design-system _site/styleguide _site/brand-book \
            _site/brandbook _site/node_modules _site/dist _site/.github
          rm -f \
            _site/.gitignore _site/.gitattributes _site/.DS_Store \
            _site/cursor.json _site/package.json _site/package-lock.json \
            _site/vite.config.ts _site/tsconfig.json \
            _site/AGENTS.md _site/README.md _site/readme.md \
            _site/design-system.html _site/styleguide.html _site/brand-book.html \
            _site/*.md
          echo "Public artifact contents:"
          find _site -maxdepth 2 -print | sort

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
